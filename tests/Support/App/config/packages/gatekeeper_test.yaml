# Configuration of the throwaway project the functional suite boots. The classes referenced under
# tsf_gatekeeper are created by Tsf\GatekeeperBundle\Tests\Support\Fixture\ClassFixtures.
parameters:
    secret: tsf-gatekeeper-functional-tests
    env(PIMCORE_TEST_DB_DSN): ~

framework:
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                tags: true
                default_lifetime: 31536000
                adapter: cache.adapter.array

doctrine:
    dbal:
        connections:
            default:
                url: '%env(PIMCORE_TEST_DB_DSN)%'
                host: ~
                port: ~
                dbname: ~
                user: ~
                password: ~
                mapping_types:
                    bit: boolean

pimcore:
    config_location:
        image_thumbnails: { write_target: { type: settings-store } }
        video_thumbnails: { write_target: { type: settings-store } }
        document_types: { write_target: { type: settings-store } }
        predefined_properties: { write_target: { type: settings-store } }
        predefined_asset_metadata: { write_target: { type: settings-store } }
        perspectives: { write_target: { type: settings-store } }
        custom_views: { write_target: { type: settings-store } }
        object_custom_layouts: { write_target: { type: settings-store } }
        select_options: { write_target: { type: settings-store } }
        system_settings:
            write_target: { type: settings-store }
            read_target: { type: settings-store }

tsf_gatekeeper:
    classes:
        GkProduct:
            required: [sku, name, title]
            languages: [en, de]
            gate: block
            score_field: completeness
            profiles:
                print:
                    required: [description, bricks.GkDimensions.width, features.GkFeature.label]
                    languages: [en]
                    threshold: 50
        GkCategory:
            required: [name, title]
            languages: [en]
            gate: warn
    report:
        studio: true
        asset:
            enabled: true
            folder: /reports/completeness
            formats: [csv, md]
            on_save: false
